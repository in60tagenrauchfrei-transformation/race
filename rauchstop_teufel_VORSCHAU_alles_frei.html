<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="author" content="Frank Zimmermann"><meta name="copyright" content="Design by Frank Zimmermann © 2026">

<meta name="theme-color" content="#0b0a0f">
<title>Rauchstop Teufel – Ab hier gehen wenige weiter</title>
<meta name="description" content="Die 21-Tage-Rauchstopp-Reise, die sich an dich anpasst: Teufel, Fragen und Hilfen entwickeln sich mit jedem Tag.">
<style>
:root{--bg:#0b0a0f;--bg2:#14121b;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--tx:#f4f0ea;--mu:#a9a3b3;--ac:#ff5a36;--ac2:#ffb347;--ok:#3ddc97;--bad:#ff4d6d;--r:22px;--glow:rgba(255,90,54,.35)}
[data-ph="1"]{--ac:#ff8a2a;--ac2:#ffd166;--glow:rgba(255,138,42,.33)}
[data-ph="2"]{--ac:#f2c14e;--ac2:#7bdff2;--glow:rgba(242,193,78,.3)}
[data-ph="3"]{--ac:#3ddc97;--ac2:#ffe27a;--glow:rgba(61,220,151,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'AudiType','Audi Type','Audi Type Screen',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'AudiTypeExtended','Audi Type Extended','AudiType','Audi Type','Impact','Arial Black',system-ui,sans-serif;letter-spacing:.01em;line-height:1.05;margin:0;text-transform:uppercase}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
canvas#fw{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
.glow{position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(60% 60% at 50% 0%,var(--glow),transparent 70%);z-index:0;pointer-events:none;transition:background 1.5s}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 16px 130px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:15px 24px;font-weight:800;font-size:1rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d05;box-shadow:0 10px 30px -8px var(--glow);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:.85rem;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ac2);font-weight:800}
.mu{color:var(--mu)}.c{text-align:center}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.logo{font-family:Impact,sans-serif;text-transform:uppercase;font-size:1.05rem;letter-spacing:.04em}.logo b{color:var(--ac)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700}
.bar{height:10px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.2,1)}
/* landing */
.hero{text-align:center;padding:30px 0 10px}
.hero h1{font-size:clamp(2.6rem,11vw,5rem);background:linear-gradient(180deg,#fff,var(--ac2) 60%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px var(--glow))}
.hero p{max-width:520px;margin:16px auto 24px;color:var(--mu);font-size:1.08rem}
.devils{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:8px 0 0;flex-wrap:nowrap}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.feat .card{margin:0}.feat h3{font-size:1.1rem;margin:6px 0}
.big{font-size:2.4rem}
.roadmini{display:flex;gap:4px;margin-top:10px}.roadmini i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.1)}
/* wizard */
.wiz h2{font-size:1.9rem;margin:8px 0 6px}
.field{display:block;margin:14px 0}.field span{display:block;font-size:.82rem;color:var(--mu);margin-bottom:6px;font-weight:700}
input[type=text],input[type=number],textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}.pick{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:99px;padding:9px 15px;font-weight:700;font-size:.9rem}
.pick.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d05;border-color:transparent}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;gap:6px;margin:6px 0 4px}.dots i{height:5px;flex:1;border-radius:9px;background:rgba(255,255,255,.12)}.dots i.on{background:var(--ac)}
/* nav */
nav.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:50;display:flex;gap:2px;background:rgba(20,18,27,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;width:min(94vw,520px)}
nav.dock button{flex:1;background:none;border:0;padding:8px 2px;border-radius:20px;font-size:.68rem;font-weight:800;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.dock button span{font-size:1.25rem}nav.dock button.on{background:rgba(255,255,255,.1);color:var(--tx)}
#sos{position:fixed;right:max(14px,calc(50% - 370px));bottom:96px;z-index:60;width:66px;height:66px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 30%,#ff7a6b,#d4141f);color:#fff;font-weight:900;font-size:.62rem;box-shadow:0 0 0 0 rgba(255,60,60,.6),0 12px 30px rgba(212,20,31,.5);animation:pulse 2.4s infinite}
#sos b{display:block;font-size:1.5rem;line-height:1}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(255,60,60,0),0 12px 30px rgba(212,20,31,.5)}100%{box-shadow:0 0 0 0 rgba(255,60,60,0),0 12px 30px rgba(212,20,31,.5)}}
/* today */
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.countdown div{background:rgba(0,0,0,.3);border-radius:14px;padding:10px 4px}.countdown b{display:block;font-size:1.5rem;font-family:Impact,sans-serif}.countdown small{color:var(--mu);font-size:.7rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:rgba(0,0,0,.28);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.25rem;color:var(--ac2)}.stat small{font-size:.7rem;color:var(--mu)}
.stage{position:relative;display:flex;gap:14px;align-items:flex-end}
.stage .por{width:130px;flex:none;filter:drop-shadow(0 12px 20px rgba(0,0,0,.6))}
.bubble{position:relative;background:#fff;color:#1b1320;border-radius:20px 20px 20px 4px;padding:14px 16px;font-weight:600;font-size:.98rem;line-height:1.4}
.bubble:before{content:'';position:absolute;left:-9px;bottom:0;border:9px solid transparent;border-right-color:#fff;border-bottom-color:#fff;border-left:0;border-top:0}
.bubble small{display:block;font-weight:800;color:#c4260f;margin-bottom:3px;letter-spacing:.06em;text-transform:uppercase;font-size:.68rem}
.power{margin-top:12px}.power .bar>i{background:linear-gradient(90deg,#ff4d6d,#ff9a3c)}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.12)}.steps i.on{background:var(--ac)}.steps i.ok{background:var(--ok)}
.truth{border-left:4px solid var(--ok);padding-left:14px;white-space:pre-line}
.mission{white-space:pre-line}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:9px 0;font-weight:600;transition:.15s}
.opt:hover{border-color:var(--ac);transform:translateX(3px)}
.opt.ok{background:rgba(61,220,151,.18);border-color:var(--ok)}.opt.bad{background:rgba(255,77,109,.18);border-color:var(--bad);animation:shake .4s}
.opt[disabled]{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:10px;padding:14px;border-radius:16px;background:rgba(0,0,0,.3)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:99px;color:var(--ac2);margin-bottom:8px}
.callback{font-style:italic;border-left:3px solid var(--ac2);padding:6px 12px;color:var(--mu);margin:10px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}.check i{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal}.check.on i{background:var(--ok);border-color:var(--ok);color:#06251a}
input[type=range]{width:100%;accent-color:var(--ac)}
.moods{display:flex;gap:8px;justify-content:space-between}.moods button{flex:1;font-size:1.7rem;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:8px 0}.moods button.on{border-color:var(--ac);background:var(--glow)}
/* journey */
.road{position:relative;padding:10px 0}
.node{display:flex;align-items:center;gap:14px;margin:0 0 10px;position:relative}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.dot{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:Impact,sans-serif;font-size:1.25rem;background:rgba(255,255,255,.07);border:2px solid var(--line);position:relative}
.node.done .dot{background:var(--ok);color:#06251a;border-color:var(--ok)}
.node.cur .dot{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d05;border:0;box-shadow:0 0 0 6px var(--glow);animation:pulse2 2s infinite}
.node.lock{opacity:.45}
@keyframes pulse2{50%{box-shadow:0 0 0 12px transparent}}
.node .t{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer}.node .t b{display:block}.node .t small{color:var(--mu)}
.phase{font-family:Impact,sans-serif;text-transform:uppercase;color:var(--ac2);margin:22px 0 10px;font-size:1.1rem}
/* misc */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.badge{background:rgba(0,0,0,.28);border-radius:16px;padding:12px;text-align:center;font-size:.8rem}.badge.off{opacity:.3;filter:grayscale(1)}.badge span{font-size:2rem;display:block}
.hl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}.hl:last-child{border:0}.hl.off{opacity:.4}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,4,8,.88);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 14px 40px;animation:fade .25s}
.modal>div{width:min(560px,100%);margin:auto}
@keyframes fade{from{opacity:0}}
.breath{width:230px;height:230px;margin:20px auto;border-radius:50%;background:radial-gradient(circle,var(--ac2),var(--ac) 60%,transparent 72%);display:grid;place-items:center;font-family:Impact,sans-serif;font-size:1.5rem;color:#1a0d05;transform:scale(.55);transition:transform 4s ease-in-out;text-align:center;text-transform:uppercase}
.breath.in{transform:scale(1)}.breath.out{transform:scale(.55);transition-duration:6s}
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#fff;color:#16111d;border-radius:99px;padding:10px 18px;font-weight:800;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:drop .4s cubic-bezier(.2,1.4,.4,1)}.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}}
.rise{animation:rise .5s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.bob{animation:bob 3.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.warn{font-size:.78rem;color:var(--mu);margin-top:20px;text-align:center}
.hotline{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35);border-radius:16px;padding:12px 14px;font-size:.88rem}
.rev{opacity:0;transform:translateY(24px);transition:.7s}.rev.v{opacity:1;transform:none}
@media(max-width:520px){.stage{flex-direction:column;align-items:flex-start}.stage .por{width:104px}.bubble:before{display:none}.pgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.por{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:22px;border:3px solid var(--c,#ff5a36);background:#2a1a10;box-shadow:0 0 24px -4px var(--c,#ff5a36)}
.devils{display:block}.heroimg{width:100%;max-width:640px;height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}

.copy{position:relative;z-index:1;text-align:center;font-size:.72rem;color:var(--mu);padding:0 16px 120px;margin-top:-100px}

.legal{margin-bottom:6px}.legal button{background:none;border:0;color:var(--ac2);font-size:.78rem;text-decoration:underline;padding:2px}
.modal a.btn{text-decoration:none}

#printplan{display:none}
@media print{body>*:not(#printplan){display:none!important}#printplan{display:block!important;background:#fff;color:#000;padding:18mm;font:11pt/1.4 Arial,sans-serif}#printplan h3{margin:14px 0 4px;text-transform:uppercase;font-size:10pt;letter-spacing:.1em;color:#c4260f}}
nav.dock button{font-size:.62rem}


.feat .card{padding:16px 14px}.feat .card p{font-size:.84rem;line-height:1.4}.feat h3{font-size:1rem}
@media(max-width:620px){.feat{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px;-webkit-overflow-scrolling:touch}.feat .card{flex:0 0 68%;scroll-snap-align:start}}

.vidc{padding:18px}.expl{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000;display:block;box-shadow:0 10px 40px rgba(255,90,54,.25)}
</style></head><body data-ph="0"><canvas id="fx"></canvas><canvas id="fw"></canvas><div class="glow"></div><div id="toasts" class="toasts"></div>

const TRIG_ORDER=['stress','pause','kaffee','langeweile','essen','alkohol','auto','gefuehle'];
const T={
kaffee:{label:'Kaffee & Frühstück',ico:'☕',teufel:'Kaffee-Kalle',color:'#d9893a',
 lie:'Ohne mich schmeckt dein Kaffee doch nur halb!',
 truth:'Rauch betäubt Zunge und Nase. Viele merken schon nach wenigen Tagen, wie viel mehr Aroma ihr Kaffee hat. „Kaffee = Zigarette“ ist nur gelernt – und Gelerntes lässt sich umschreiben.',
 tool:'Ändere die Szene: andere Tasse, anderer Platz, erst Zähneputzen, dann Kaffee. Halte die Tasse mit beiden Händen und rieche bewusst daran.',
 ifthen:'Wenn ich Kaffee trinke, dann gehe ich ans Fenster, halte die Tasse mit beiden Händen und rieche dreimal bewusst daran.',
 rescue:'Du sitzt mit Kollegen beim Kaffee – alle gehen danach rauchen.',
 q:[{q:'Dein erster Kaffee ohne Zigarette: Was passiert oft?',a:['Er schmeckt furchtbar, ich brauche die Kippe','Er schmeckt oft sogar intensiver – die Kopplung war nur gelernt','Ich trinke nie wieder Kaffee'],c:1,why:'Der Kaffee war nie das Problem. Der Auslöser ist die gelernte Kopplung – und die verblasst.'},
 {q:'Welche Änderung hilft bei der Kaffee-Gewohnheit am meisten?',a:['Alles genauso machen, nur ohne Zigarette','Ort, Tasse und Ablauf ändern und die Hände beschäftigen','Mehr Kaffee trinken, bis das Verlangen aufhört'],c:1,why:'Neue Szene = schwächeres Signal. Je weniger der Ablauf dem alten gleicht, desto leiser der Auslöser.'},
 {q:'Alle gehen nach dem Kaffee rauchen. Dein stärkster Zug?',a:['Mitgehen und nur „die Luft schnuppern“','Freundlich „Ich bleibe sitzen“ sagen, Wasser holen, Thema wechseln','Heimlich eine schnorren'],c:1,why:'Passivrauch hält das Signal am Leben. Wähle bewusst einen rauchfreien Platz – ohne Rechtfertigung.'}]},
stress:{label:'Stress & Anspannung',ico:'⚡',teufel:'Stress-Steffi',color:'#ff3b3b',
 lie:'Du bist angespannt? Rauch eine – das beruhigt dich doch!',
 truth:'Nikotin treibt Puls und Blutdruck eher hoch. Die gefühlte Beruhigung ist oft das Ende des Mini-Entzugs, den die Zigarette vorher mitverursacht hat. Beruhigt hat dich schon immer die Pause und das lange Ausatmen.',
 tool:'4-6-Atmung: 4 Sekunden ein, 6 Sekunden aus, sechs Runden. Danach zwei Minuten gehen – am besten an die frische Luft.',
 ifthen:'Wenn Stress hochkommt, dann atme ich sechsmal 4-6 und gehe zwei Minuten an die frische Luft.',
 rescue:'Heftiger Streit oder Deadline – dein Kopf schreit nach der Kippe.',
 q:[{q:'Was beruhigt dich in Stressmomenten wirklich?',a:['Nikotin, weil es den Puls senkt','Die Pause, frische Luft und langes Ausatmen','Eine zweite Zigarette direkt hinterher'],c:1,why:'Nikotin wirkt eher aktivierend. Die Beruhigung kommt aus Pause und Atmung – beides gehört dir.'},
 {q:'Welcher Plan trägt dich durch Stress?',a:['Hoffen, dass kein Stress kommt','Ein Wenn-dann-Plan mit Atmung und Gehen','Den Stress einfach ignorieren'],c:1,why:'Wer vorher entscheidet, muss im Moment nicht mehr verhandeln. Ein Plan schlägt reine Willenskraft.'},
 {q:'Mitten im Streit flüstert der Teufel „Nur eine“. Was jetzt?',a:['Rauchen und danach weiterstreiten','Raus aus der Situation, sechs Atemzüge, Wasser – erst dann reagieren','Lauter werden'],c:1,why:'Abstand + Atmung nehmen der Welle die Spitze. Entscheidungen im Alarmmodus sind selten deine besten.'}]},
pause:{label:'Pausen & Arbeit',ico:'⏱',teufel:'Pausen-Paule',color:'#ff8a00',
 lie:'Eine Pause ohne Kippe ist doch keine Pause!',
 truth:'Nicht die Zigarette macht die Pause, sondern das Aufstehen, Rausgehen und Abschalten. Die Zigarette hat die Pause nur „besetzt“. Hol sie dir zurück.',
 tool:'Pausenkarte: drei feste Mini-Pausen (Spaziergang, Tee, Nachricht an jemanden) – zur gleichen Uhrzeit wie früher.',
 ifthen:'Wenn meine alte Rauchpause beginnt, dann gehe ich fünf Minuten raus und rufe jemanden an oder dehne mich.',
 rescue:'Kollegen fragen: „Kommst du mit raus?“',
 q:[{q:'Was machte die Rauchpause wirklich erholsam?',a:['Der Rauch','Aufstehen, Rausgehen, Abschalten','Der Husten danach'],c:1,why:'Die Erholung steckt in der Unterbrechung – nicht im Rauch.'},
 {q:'Wie behältst du deine Pause ohne Zigarette?',a:['Gar keine Pausen mehr machen','Zur gleichen Uhrzeit eine rauchfreie Ersatz-Pause einplanen','Mehr arbeiten, damit es nicht auffällt'],c:1,why:'Die Uhrzeit ist das Signal. Behalte sie – nur der Inhalt ändert sich.'},
 {q:'„Kommst du mit raus?“ – Dein stärkster Satz?',a:['„Nein danke, ich rauche nicht mehr – ich hole mir einen Tee.“','„Ok, aber ich rauche nicht mit.“ (und stehst mittendrin)','„Vielleicht später …“'],c:0,why:'Klar, freundlich, mit Alternative. Mittendrin stehen hält das Signal am Leben.'}]},
alkohol:{label:'Alkohol & Feiern',ico:'🍻',teufel:'Party-Pablo',color:'#b44cff',
 lie:'Ein Bier ohne Kippe? Das geht doch gar nicht!',
 truth:'Alkohol senkt die Hemmschwelle und ist für viele der gefährlichste Rückfall-Auslöser. Das ist kein Charakterfehler, sondern Biochemie plus Gewohnheit. Mit Plan kommst du durch.',
 tool:'Vorher festlegen: Glas immer in der Hand, rauchfreier Platz, dein „Nein danke“-Satz, feste Ausstiegszeit, eine Verbündete Person.',
 ifthen:'Wenn ich auf einer Feier bin, dann halte ich immer ein Glas in der Hand, bleibe bei den Nichtrauchern und gehe spätestens zur geplanten Uhrzeit.',
 rescue:'Dritte Runde – alle stehen draußen beim Rauchen.',
 q:[{q:'Wie wirkt Alkohol auf deinen Rauchstopp?',a:['Er hilft beim Durchhalten','Er senkt die Hemmschwelle und erhöht das Rückfallrisiko','Er hat gar keinen Einfluss'],c:1,why:'Gerade bei Feiern passieren viele Ausrutscher. Wer das weiß, kann sich vorbereiten.'},
 {q:'Was gehört in deinen Party-Plan?',a:['Spontan entscheiden','Glas in der Hand, rauchfreier Platz, früher gehen dürfen, Verbündete','Mehr trinken, damit es leichter wird'],c:1,why:'Je konkreter der Plan, desto weniger Raum für den Teufel im Moment.'},

function revObs(){const els=$$('.rev:not(.v)');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('v'));return}const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('v');io.unobserve(x.target)}}),{threshold:.1});els.forEach(e=>io.observe(e))}
setInterval(()=>{if(!P())return;const c=fmtCD(stats().ms);['d','h','m','s'].forEach(k=>{const e=document.querySelector(`[data-cd="${k}"]`);if(e)e.textContent=c[k]})},1000);
